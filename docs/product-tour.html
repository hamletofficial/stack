<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Product tour for Hamlet.">
  <title>Hamlet Product Tour</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    main {
      width: min(100%, 760px);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid #263247;
      border-radius: 1rem;
      background: #111827;
      box-sizing: border-box;
    }
    h1 { margin-top: 0; color: #fff; }
    p { line-height: 1.7; color: #cbd5e1; }
    .eyebrow {
      color: #93c5fd;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Hamlet</p>
    <h1>Product Tour</h1>
    <p>This page is the starting point for the Hamlet product tour.</p>
  </main>
</body>
</html>
